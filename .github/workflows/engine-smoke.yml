name: Engine image smoke
on:
  pull_request:
    paths: ['Dockerfile', 'engine-lock.json', 'container/**', 'smoke/**', 'scripts/render-smoke.py', 'scripts/engine-update*.mjs', '.github/workflows/engine-update.yml', '.github/workflows/engine-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/engine-update.test.mjs
      - name: Build candidate image (no deployment)
        run: docker build --progress=plain -t ptxprint-candidate .
      - name: Real fresh render
        run: |
          for fixture in bsb-jhn-empirical bsb-psa-empirical bsb-jud-empirical; do
            mkdir -p "artifacts/$fixture"
            docker run --rm --entrypoint python -v "$PWD/smoke:/fixtures:ro" -v "$PWD/scripts:/checks:ro" -v "$PWD/artifacts/$fixture:/artifacts" ptxprint-candidate /checks/render-smoke.py "$fixture.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-render-evidence
          path: artifacts/
